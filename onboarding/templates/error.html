<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Digest — Error</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f8f9fa; color: #212529; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
          padding: 48px 56px; max-width: 480px; width: 90%; text-align: center; }
  h1 { color: #dc3545; font-size: 1.6rem; margin-bottom: 12px; }
  .msg { color: #6c757d; margin-bottom: 28px; }
  a { color: #4285F4; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:3rem;margin-bottom:8px">⚠️</div>
  <h1>Something went wrong</h1>
  <p class="msg">{{ message }}</p>
  <a href="/">← Back to home</a>
</div>
</body>
</html>
